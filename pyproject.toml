[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "selection-pressure"
dynamic = ["version"]
description = "Real-time boid flocking, black-hole predators and evolution, built as a wall-projection installation."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Burak Kagan Yilmazer" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "pygame>=2.5,<3",
]
keywords = ["boids", "flocking", "generative-art", "genetic-algorithm", "pygame", "simulation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Artistic Software",
    "Topic :: Scientific/Engineering :: Artificial Life",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3.7"]

[project.urls]
Homepage = "https://github.com/burakkagann/selection-pressure"
Issues = "https://github.com/burakkagann/selection-pressure/issues"

[project.scripts]
selection-pressure = "selection_pressure.cli:main"

[tool.hatch.version]
path = "src/selection_pressure/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/selection_pressure"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "preserve"
